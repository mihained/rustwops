[package]
name = "rustwops"
version = "0.4.0"
edition = "2021"
authors = ["RustWops Contributors"]
description = "High-performance CLI for managing web server stacks"
license = "MIT"
repository = "https://github.com/mihained/rustwops"
keywords = ["cli", "nginx", "php", "wordpress", "devops"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "rw"
path = "src/main.rs"

[features]
default = []
api = ["axum", "tower-http"]

[dependencies]
# CLI
clap = { version = "4.4", features = ["derive", "env", "color"] }

# Async
tokio = { version = "1.35", features = ["full"] }

# Data serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# Database
rusqlite = { version = "0.30", features = ["bundled"] }

# Templates
tera = "1.19"

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4"] }
regex = "1.10"
walkdir = "2.4"
dirs = "5.0"
which = "6.0"

# Console output
colored = "2.1"
indicatif = "0.17"
dialoguer = "0.11"
tabled = "0.15"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Compression (backups)
flate2 = "1.0"
tar = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Password/crypto
rand = "0.8"
base64 = "0.21"

# System
libc = "0.2"

# API (optional feature)
axum = { version = "0.7", optional = true }
tower-http = { version = "0.5", features = ["cors", "trace"], optional = true }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
